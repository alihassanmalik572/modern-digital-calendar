<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef2;--surface:#fbfcfd;--ink:#16212b;--muted:#6a7885;--line:#d5dde4;--accent:#0f6b63;--accent-ink:#fff;--today:#f2b632;--other:#f1f4f7;
  --c-teal:#0f6b63;--c-blue:#2f5bd6;--c-plum:#8a3fa0;--c-rust:#c2492b;
  --head:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161c;--surface:#18222b;--ink:#e8eef3;--muted:#8d9ca9;--line:#2a3743;--accent:#3cc4b6;--accent-ink:#06201d;--today:#f2b632;--other:#141d25;
  --c-teal:#3cc4b6;--c-blue:#7c9bff;--c-plum:#c78be0;--c-rust:#ff8a6b;}}
:root[data-theme="dark"]{
  --bg:#0f161c;--surface:#18222b;--ink:#e8eef3;--muted:#8d9ca9;--line:#2a3743;--accent:#3cc4b6;--accent-ink:#06201d;--today:#f2b632;--other:#141d25;
  --c-teal:#3cc4b6;--c-blue:#7c9bff;--c-plum:#c78be0;--c-rust:#ff8a6b;}
*{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:linear-gradient(rgba(60,196,182,.12) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(60,196,182,.12) 1px,transparent 1px) 0 0/40px 40px,radial-gradient(circle at 12% 8%,rgba(47,91,214,.6),transparent 45%),radial-gradient(circle at 88% 88%,rgba(138,63,160,.55),transparent 45%),radial-gradient(circle at 72% 12%,rgba(15,184,170,.4),transparent 40%),#050a14;background-attachment:fixed;color:var(--ink);font:15px/1.45 var(--body);display:flex;justify-content:center;padding:20px 14px}
.app{width:100%;max-width:1080px;display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.app{position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(60,196,182,.14) 50%,transparent) 0 -160px/100% 160px no-repeat;animation:scan 8s linear infinite}
body::after{content:"";position:fixed;width:50vmax;height:50vmax;left:-10vmax;top:-10vmax;border-radius:50%;background:radial-gradient(circle,rgba(60,196,182,.24),transparent 65%);pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
@keyframes scan{to{background-position:0 100vh}}
@keyframes drift{to{transform:translate(55vw,35vh)}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
.panel{background:color-mix(in srgb,var(--surface) 90%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 10px 40px rgba(0,0,0,.45),0 0 36px color-mix(in srgb,var(--accent) 22%,transparent)}
.cal{padding:18px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
h1{font:700 clamp(1.5rem,4vw,2.2rem)/1.1 var(--head);margin:0 auto 0 0;letter-spacing:-.02em}
h1 span{color:var(--muted);font-weight:500}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon{width:36px;padding:7px 0;text-align:center}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:4px 6px;color:var(--muted);font-size:.8rem;font-weight:600}
.grid{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.day{min-height:96px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;background:var(--surface);text-align:left;border-radius:0;font-size:.9rem}
.day.out{background:var(--other);color:var(--muted)}
.day:hover{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.num{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:600;font-size:.85rem}
.day.today .num{background:var(--today);color:#2a1f00}
.chip{font-size:.74rem;line-height:1.25;padding:2px 6px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c)}
:root[data-theme="dark"] .chip,.dk .chip{color:#0c1217}
.more{font-size:.72rem;color:var(--muted)}
.side{padding:18px;position:sticky;top:16px}
.clock{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.clock b{display:block;font:700 2.4rem/1 var(--head);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock b small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:6px}
.clock span{color:var(--muted);font-size:.85rem}
.side h2{font:700 1.3rem/1.2 var(--head);margin:0 0 2px}
.side .sub{color:var(--muted);margin:0 0 14px;font-size:.85rem}
.ev{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ev i{width:4px;align-self:stretch;border-radius:2px;background:var(--c)}
.ev div{flex:1;min-width:0}.ev b{display:block;overflow-wrap:anywhere}.ev small{color:var(--muted)}
.ev button{padding:3px 8px;font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);padding:10px 0}
form{display:grid;gap:10px;margin-top:16px}
label{font-size:.82rem;font-weight:600;display:grid;gap:4px}
input[type=text],input[type=time]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.colors{display:flex;gap:8px}
.colors input{position:absolute;opacity:0}
.colors span{display:block;width:26px;height:26px;border-radius:50%;background:var(--c);cursor:pointer;border:2px solid var(--surface)}
.colors input:checked+span{box-shadow:0 0 0 2px var(--ink)}
.colors input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.colors label{position:relative;display:block}
.year{display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px}
.mh{border:0;padding:2px 4px;font:700 1rem var(--head);margin-bottom:4px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dw{font-size:.7rem;color:var(--muted)}
.md{border:0;border-radius:50%;padding:0;aspect-ratio:1;font-size:.75rem;position:relative;display:grid;place-items:center}
.md:hover{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.md.has::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.md.today{background:var(--today);color:#2a1f00;font-weight:600}
.md.sel{box-shadow:inset 0 0 0 2px var(--accent)}
@media(max-width:820px){
  .app{grid-template-columns:1fr}.side{position:static}
  .day{min-height:64px;padding:4px}.chip{font-size:0;height:6px;padding:0;border-radius:3px}
  .cal{padding:12px}
}
</style>
</head>
<body>
<main class="app">
  <section class="panel cal" aria-label="Calendar">
    <div class="clock" aria-live="off"><b id="clockTime"></b><span id="clockDate"></span></div>
    <div class="top">
      <h1 id="title"></h1>
      <button class="icon" id="prev" aria-label="Previous month">‹</button>
      <button id="today">Today</button>
      <button class="icon" id="next" aria-label="Next">›</button>
      <button id="viewBtn">Year view</button>
    </div>
    <div class="dow" id="dow"></div>
    <div class="grid" id="grid" role="grid"></div>
    <div class="year" id="year"></div>
  </section>
  <aside class="panel side" aria-live="polite">
    <h2 id="selTitle"></h2>
    <p class="sub" id="selSub"></p>
    <div id="list"></div>
    <form id="form">
      <label>Event title<input type="text" id="evTitle" maxlength="80" required placeholder="Dentist appointment"></label>
      <label>Time (optional)<input type="time" id="evTime"></label>
      <div class="colors" role="radiogroup" aria-label="Event colour" id="colors"></div>
      <button class="primary" type="submit">Add event</button>
    </form>
  </aside>
</main>
<script>
(function(){
  var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var COLORS=[["teal","var(--c-teal)"],["blue","var(--c-blue)"],["plum","var(--c-plum)"],["rust","var(--c-rust)"]];
  var KEY="digital-calendar-events";
  var events={};
  try{events=JSON.parse(localStorage.getItem(KEY)||"{}")||{};}catch(e){events={};}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(events));}catch(e){}}
  var now=new Date();
  var view=new Date(now.getFullYear(),now.getMonth(),1);
  var selected=iso(now);
  function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function $(id){return document.getElementById(id);}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function sorted(k){return (events[k]||[]).slice().sort(function(a,b){return (a.time||"99:99")<(b.time||"99:99")?-1:1;});}
  function fmtTime(t){if(!t)return "All day";var h=+t.slice(0,2),m=t.slice(3);return ((h%12)||12)+":"+m+(h<12?" AM":" PM");}

  $("dow").innerHTML=DAYS.map(function(d){return "<div>"+d+"</div>";}).join("");
  var cw=$("colors");
  COLORS.forEach(function(c,i){
    var l=el("label"),r=document.createElement("input");
    r.type="radio";r.name="color";r.value=c[0];r.setAttribute("aria-label",c[0]);if(i===0)r.checked=true;
    var s=el("span");s.style.setProperty("--c",c[1]);l.append(r,s);cw.append(l);
  });
  function colorVar(n){var f=COLORS.filter(function(c){return c[0]===n;})[0];return f?f[1]:COLORS[0][1];}

  function renderGrid(){
    var y=view.getFullYear(),m=view.getMonth();
    $("title").innerHTML=MONTHS[m]+" <span>"+y+"</span>";
    var g=$("grid");g.innerHTML="";
    var start=new Date(y,m,1-new Date(y,m,1).getDay());
    var todayKey=iso(new Date());
    for(var i=0;i<42;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),k=iso(d);
      var b=el("button","day"+(d.getMonth()!==m?" out":"")+(k===todayKey?" today":"")+(k===selected?" sel":""));
      b.type="button";b.setAttribute("role","gridcell");
      b.setAttribute("aria-label",d.toDateString()+", "+sorted(k).length+" events");
      b.append(el("span","num",d.getDate()));
      var ev=sorted(k);
      ev.slice(0,3).forEach(function(e){var c=el("span","chip",(e.time?e.time+" ":"")+e.title);c.style.setProperty("--c",colorVar(e.color));b.append(c);});
      if(ev.length>3)b.append(el("span","more","+"+(ev.length-3)+" more"));
      (function(key,date){b.addEventListener("click",function(){
        selected=key;
        if(date.getMonth()!==view.getMonth()){view=new Date(date.getFullYear(),date.getMonth(),1);}
        render();
      });})(k,d);
      g.append(b);
    }
  }
  function renderSide(){
    var d=parse(selected);
    $("selTitle").textContent=d.toLocaleDateString("en-US",{weekday:"long"});
    $("selSub").textContent=d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
    var list=$("list");list.innerHTML="";
    var ev=sorted(selected);
    if(!ev.length){list.append(el("div","empty","Nothing planned. Add an event below."));return;}
    ev.forEach(function(e){
      var row=el("div","ev"),bar=el("i");bar.style.setProperty("--c",colorVar(e.color));
      var info=el("div");info.append(el("b",null,e.title),el("small",null,fmtTime(e.time)));
      var del=el("button",null,"Delete");del.type="button";del.setAttribute("aria-label","Delete "+e.title);
      del.addEventListener("click",function(){
        events[selected]=(events[selected]||[]).filter(function(x){return x.id!==e.id;});
        if(!events[selected].length)delete events[selected];
        save();render();
      });
      row.append(bar,info,del);list.append(row);
    });
  }
  var mode="month";
  function renderYear(){
    var y=view.getFullYear();
    $("title").textContent=y;
    var wrap=$("year");wrap.innerHTML="";
    var todayKey=iso(new Date());
    for(var m=0;m<12;m++){
      var box=el("div","mini");
      var h=el("button","mh",MONTHS[m]);h.type="button";
      (function(mm){h.onclick=function(){view=new Date(y,mm,1);setMode("month");};})(m);
      box.append(h);
      var g=el("div","mg");
      "SMTWTFS".split("").forEach(function(c){g.append(el("span","dw",c));});
      var first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
      for(var i=0;i<first;i++)g.append(el("span"));
      for(var d=1;d<=dim;d++){
        var k=iso(new Date(y,m,d));
        var b=el("button","md"+(k===todayKey?" today":"")+(events[k]?" has":"")+(k===selected?" sel":""),d);
        b.type="button";b.setAttribute("aria-label",new Date(y,m,d).toDateString());
        (function(key,mm){b.onclick=function(){selected=key;view=new Date(y,mm,1);setMode("month");};})(k,m);
        g.append(b);
      }
      box.append(g);wrap.append(box);
    }
  }
  function setMode(m){
    mode=m;
    $("dow").style.display=$("grid").style.display=m==="month"?"":"none";
    $("year").style.display=m==="year"?"grid":"none";
    $("viewBtn").textContent=m==="year"?"Month view":"Year view";
    render();
  }
  function render(){if(mode==="year")renderYear();else renderGrid();renderSide();}

  function shift(n){
    view=mode==="year"?new Date(view.getFullYear()+n,view.getMonth(),1):new Date(view.getFullYear(),view.getMonth()+n,1);
    render();
  }
  $("prev").onclick=function(){shift(-1);};
  $("next").onclick=function(){shift(1);};
  $("viewBtn").onclick=function(){setMode(mode==="month"?"year":"month");};
  $("today").onclick=function(){var n=new Date();view=new Date(n.getFullYear(),n.getMonth(),1);selected=iso(n);render();};
  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var t=$("evTitle").value.trim();if(!t)return;
    var col=document.querySelector("input[name=color]:checked").value;
    (events[selected]=events[selected]||[]).push({id:Date.now()+Math.random(),title:t,time:$("evTime").value,color:col});
    save();$("evTitle").value="";$("evTime").value="";render();$("evTitle").focus();
  });
  document.addEventListener("keydown",function(e){
    if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
    if(e.key==="ArrowLeft")$("prev").click();
    if(e.key==="ArrowRight")$("next").click();
  });
  var lastDay=iso(new Date());
  function tick(){
    var n=new Date();
    var parts=n.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"}).split(" ");
    $("clockTime").innerHTML=parts[0]+(parts[1]?"<small>"+parts[1]+"</small>":"");
    $("clockDate").textContent=n.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
    if(iso(n)!==lastDay){lastDay=iso(n);render();}
  }
  tick();setInterval(tick,1000);
  render();
})();
</script>
</body>
</html>
